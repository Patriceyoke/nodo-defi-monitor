manifestVersion: 1
id: nodo-defi-monitor
category: finance
name: Monitor DeFi
version: "0.7.4"
tagline: "Tieni d'occhio la DeFi in sola lettura, divisa tra Io e Moglie"
icon: https://raw.githubusercontent.com/Patriceyoke/nodo-defi-monitor/main/nodo-defi-monitor/icon.png
description: >-
  Monitor DeFi è un'app in sola lettura per seguire posizioni DeFi su Ethereum
  (Lido, Rocket Pool, Aave v3, Aave v4, Compound v3, Fluid, Spark, SparkLend, Sky, Maple)
  e Fluid fUSDT su BNB Chain. Lo storico orario e la stima del rendimento reale
  restano sul volume dati.

  Ogni indirizzo ha un titolare, Io o Moglie. Tutte le viste e i tool
  MCP accettano il filtro io / moglie / tutti. L'app suggerisce al massimo
  un cambio, dopo il gas, senza concentrare troppo un solo protocollo.
  Nessuna transazione parte da qui: la firma resta tua, sul tuo portafoglio
  hardware.

  L'app non accetta e non deve mai vedere seed o chiavi private. Espone un
  server MCP in sola lettura (get_portfolio, get_balances, get_apys,
  check_switch, get_alerts, get_history, get_nfts, get_security,
  get_portfolio_summary, get_risk_and_alerts, simulate_market_shock)
  per un agente come Hermes, da collegare dalle Impostazioni di umbrelOS
  (AI agents / MCP) e/o dal config.yaml di Hermes.
releaseNotes: >-
  0.7.4: ogni avviso di uscita di fondi dice da quale portafoglio e quando. Una lettura non riuscita (per esempio il valore di un vault Fluid non letto, o un aggiornamento senza rete) non fa più scattare un falso avviso, e un avviso aperto si chiude da solo quando la quantità torna quella di prima. Aggiorna l'app, non disinstallarla: il database resta.
