manifestVersion: 1
id: nodo-defi-monitor
category: finance
name: Monitor DeFi
version: "0.2.5"
tagline: "Tieni d'occhio DeFi e Bitcoin in sola lettura, divisi tra Io e Moglie"
icon: https://raw.githubusercontent.com/Patriceyoke/nodo-defi-monitor/main/nodo-defi-monitor/icon.png
description: >-
  Monitor DeFi è un'app in sola lettura per seguire posizioni DeFi su Ethereum
  (Lido, Rocket Pool, Aave v3, Compound v3, Fluid, Spark, SparkLend, Sky, Maple)
  e Fluid fUSDT su BNB Chain, più conti Bitcoin osservati da
  xpub, zpub o descrittori, letti dal tuo nodo / Electrs o Fulcrum locale.

  Ogni indirizzo o xpub ha un titolare, Io o Moglie. Tutte le viste e i tool
  MCP accettano il filtro io / moglie / tutti. L'app suggerisce uno switch
  solo se il rendimento sale a rischio uguale o inferiore, dopo il gas.
  Nessuna transazione parte da qui: la firma resta tua, sul tuo portafoglio
  hardware.

  L'app non accetta e non deve mai vedere seed o chiavi private. Espone un
  server MCP in sola lettura (get_portfolio, get_balances, get_apys,
  check_switch, get_alerts, get_history, get_btc_wallets, get_btc_security)
  per un agente come Hermes, da collegare dalle Impostazioni di umbrelOS
  (AI agents / MCP) e/o dal config.yaml di Hermes.
releaseNotes: >-
  0.2.5: piccoli ritocchi dopo il controllo di 0.2.4. L'orario dice anche
  il giorno se i dati non sono di oggi, una fonte non letta è segnata
  «non letto», e la cache NFT resta finché non premi Aggiorna. Posizioni
  vuote dicono «Nessuna posizione». I pulsanti e le sezioni sono più
  comodi da toccare. Indirizzi, impostazioni e voci nascoste restano.
