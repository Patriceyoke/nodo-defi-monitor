version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nodo-defi-monitor_web_1
      APP_PORT: 3847
      # Il server MCP dell'app deve restare raggiungibile dagli agenti, senza il login Umbrel.
      PROXY_AUTH_WHITELIST: "/mcp*"

  web:
    image: ghcr.io/patriceyoke/nodo-defi-monitor:0.3.3
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      DATA_DIR: /data
      PORT: "3847"
      # Present only when Umbrel sources the Electrs (or Fulcrum) exports.
      APP_ELECTRS_NODE_IP: ${APP_ELECTRS_NODE_IP:-}
      APP_ELECTRS_NODE_PORT: ${APP_ELECTRS_NODE_PORT:-50001}
      APP_FULCRUM_NODE_IP: ${APP_FULCRUM_NODE_IP:-}
      APP_FULCRUM_NODE_PORT: ${APP_FULCRUM_NODE_PORT:-50002}
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME:-}
      DEVICE_HOSTNAME: ${DEVICE_HOSTNAME:-}
      GATEWAY_IP: ${GATEWAY_IP:-}
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # data/.gitkeep is part of the package. Umbrel copies it into APP_DATA_DIR
      # as uid 1000 and then removes .gitkeep, so Docker does not create /data as root.
      - ${APP_DATA_DIR}/data:/data

# Electrs and Fulcrum live on Umbrel's shared network. Container names such as
# electrs_electrs_1 resolve only from there, not from a private app network.
networks:
  default:
    external: true
    name: umbrel_main_network
