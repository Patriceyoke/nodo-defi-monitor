version: "3.7"

services:
  app_proxy:
    environment:
      # Umbrel login remains enabled (the default). Do not set PROXY_AUTH_ADD
      # or CUSTOM_USER/PASSWORD: auth is handled by Umbrel's proxy.
      APP_HOST: nodo-calibre_server_1
      APP_PORT: 8080

  server:
    image: linuxserver/calibre:9.18.0@sha256:dbaefbf648b2197bd25d783830b6fbe1be0da8a0cb5d837ddc9973ebc6e6e3d2
    restart: on-failure
    stop_grace_period: 1m
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TITLE=Calibre
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    ports:
      # Optional Calibre content server (enable in Preferences > Sharing over the net).
      # Not behind Umbrel login: set a content-server password in Calibre first.
      - 8088:8081
