manifestVersion: 1
id: nodo-calibre
category: files
name: Calibre
version: "9.18.0-patch.1"
tagline: "Il programma Calibre completo nel browser, per gestire la tua biblioteca"
description: >-
  Calibre è il gestore di e-book completo (non Calibre-Web): la stessa
  applicazione desktop, aperta nel browser dal tuo Umbrel.


  Apri l'app dal riquadro su Umbrel, oppure vai su
  https://umbrel.local:8188 (non http). L'interfaccia richiede una
  connessione sicura. Al primo accesso il browser può mostrare un avviso
  sul certificato di Umbrel: è normale, procedi solo per il tuo Umbrel.
  L'accesso resta quello del login Umbrel.


  Al primo avvio scegli come percorso della biblioteca
  /config/Calibre Library. Libreria, impostazioni e i plugin installati da
  Preferenze > Plugin restano salvati nella cartella dati dell'app e
  sopravvivono agli aggiornamenti.


  Non esporre questa app su Internet: la GUI include un terminale del
  contenitore.


  Il Content Server opzionale di Calibre si abilita da Preferenze >
  Condivisione in rete (lascia la porta 8081 e attiva l'avvio automatico).
  È pubblicato sulla porta 8088 dell'Umbrel, fuori dal login Umbrel:
  imposta una password del Content Server prima di usarlo in rete.
releaseNotes: >-
  Apre Calibre su HTTPS (https://umbrel.local:8188). L'interfaccia
  desktop Selkies non funziona su HTTP. Stessa immagine
  linuxserver/calibre:9.18.0.
developer: Kovid Goyal
website: https://calibre-ebook.com
