version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nodo-casa_web_1
      APP_PORT: 8795

  web:
    image: ghcr.io/patriceyoke/nodo-casa:1.2.3
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    networks:
      - default
    volumes:
      # data/.gitkeep fa parte del pacchetto. Umbrel lo copia in APP_DATA_DIR
      # come utente 1000 e poi lo toglie, così Docker non crea /data come root.
      - ${APP_DATA_DIR}/data:/data

# Umbrel's app proxy reaches this container on the shared network.
networks:
  default:
    external: true
    name: umbrel_main_network
