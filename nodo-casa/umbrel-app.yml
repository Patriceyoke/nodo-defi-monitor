manifestVersion: 1.1
id: nodo-casa
category: files
name: Casa Viale
version: "1.2.1"
tagline: Scadenze di casa, garage, documenti e visto
description: >-
  Casa Viale elenca le scadenze di casa, del garage, dei documenti e del visto.
  Si apre una voce e si segna pagato o fatto. Non comanda la casa, il cancello,
  la stampante, la rete o la crypto.


  Il database nasce vuoto. I dati restano solo nella cartella dell'app su
  questo Umbrel. Non sono nel repository.
releaseNotes: >-
  1.2.1: Spese riunisce bollette e carte. Ogni carta resta nella sua valuta, senza sommare baht e dollari. Il mese si registra con apertura, entrate, uscite e chiusura; un campo vuoto non cancella l'estratto. Aggiorna l'app, non disinstallarla.
