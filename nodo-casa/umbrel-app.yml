manifestVersion: 1.1
id: nodo-casa
category: files
name: Casa Viale
version: "1.1.0"
tagline: Scadenze di casa, garage, documenti e visto
description: >-
  Casa Viale elenca le scadenze di casa, del garage, dei documenti e del visto.
  Si apre una voce e si segna pagato o fatto. Non comanda la casa, il cancello,
  la stampante, la rete o la crypto.


  Il database nasce vuoto. I dati restano solo nella cartella dell'app su
  questo Umbrel. Non sono nel repository.
releaseNotes: >-
  1.1.0: dopo Segna pagato o Segna fatto, le scadenze non mensili passano da sole alla data successiva (ogni N giorni, mesi o anni; il rapporto 90 giorni avanza di 90 giorni). Lo storico resta. Un avviso compare se una bolletta sale oltre la soglia (di solito +15%). In home c'è il grafico delle spese per categoria, mese e anno, in baht. La sezione Carte registra le spese mensili di credito e debito (anche in dollari, con cambio in baht), con storico e grafico. Aggiorna l'app, non disinstallarla.
