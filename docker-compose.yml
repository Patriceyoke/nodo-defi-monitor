# Installazione manuale (SSH o Portainer), senza l'App Store di Umbrel.
# L'immagine va costruita in locale oppure prelevata da GHCR dopo la pubblicazione.
services:
  web:
    build: .
    image: nodo-defi-monitor:0.2.9
    user: "1000:1000"
    init: true
    restart: unless-stopped
    ports:
      - "3847:3847"
    environment:
      DATA_DIR: /data
      PORT: "3847"
      APP_ELECTRS_NODE_IP: ${APP_ELECTRS_NODE_IP:-}
      APP_ELECTRS_NODE_PORT: ${APP_ELECTRS_NODE_PORT:-50001}
      APP_FULCRUM_NODE_IP: ${APP_FULCRUM_NODE_IP:-}
      APP_FULCRUM_NODE_PORT: ${APP_FULCRUM_NODE_PORT:-50002}
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME:-}
      GATEWAY_IP: ${GATEWAY_IP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
