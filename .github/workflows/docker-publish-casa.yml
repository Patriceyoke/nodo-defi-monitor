name: Publish Casa Viale image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "1.0.1"
  push:
    branches:
      - main
    paths:
      - "nodo-casa/**"
      - ".github/workflows/docker-publish-casa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=""
          fi
          if [ -z "$TAG" ]; then
            TAG=$(awk -F'"' '/^version:/ {print $2; exit}' nodo-casa/umbrel-app.yml)
          fi
          echo "image=ghcr.io/${OWNER}/nodo-casa:${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: nodo-casa
          file: nodo-casa/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Casa Viale
      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.meta.outputs.owner }}
        run: |
          set -u
          sleep 8
          # The Actions token can push the image but often cannot call the
          # user packages API (404). A public repo package linked by the OCI
          # source label is already public; confirm with an anonymous pull token.
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/users/${OWNER}/packages/container/nodo-casa" \
            -f visibility=public || true
          python3 - << 'PY'
          import json, os, urllib.request, urllib.error
          owner = os.environ["OWNER"]
          url = f"https://ghcr.io/token?service=ghcr.io&scope=repository:{owner}/nodo-casa:pull"
          try:
              with urllib.request.urlopen(url) as response:
                  token = json.load(response).get("token") or ""
          except urllib.error.HTTPError as exc:
              print(exc.read().decode()[:500])
              raise SystemExit(1)
          if not token:
              print("Anonymous pull token was empty")
              raise SystemExit(1)
          print("Anonymous pull token issued")
          PY
