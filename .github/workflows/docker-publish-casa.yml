name: Publish Casa Viale image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "1.0.0"
  push:
    branches:
      - main
    paths:
      - "nodo-casa/**"
      - ".github/workflows/docker-publish-casa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="1.0.0"; fi
          echo "image=ghcr.io/${OWNER}/nodo-casa:${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: nodo-casa
          file: nodo-casa/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Casa Viale
      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.meta.outputs.owner }}
        run: |
          set -u
          sleep 8
          try_patch() {
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "$1" \
              -f visibility=public
          }
          if try_patch "/users/${OWNER}/packages/container/nodo-casa"; then
            exit 0
          fi
          if try_patch "/user/packages/container/nodo-casa"; then
            exit 0
          fi
          echo "Package visibility was not changed by this token." >&2
          exit 1
